# ── No "= true" clause ────────────────────────────────────────────────────
# JDA also has bare `If(X.<field>.IsEmpty)` without an explicit comparison.
# Pine still expects the polarity-flipped Any()==true form. The
# branch-swap pre-pass handles the bare form too (added in v2.parser
# .branch_swap), so by the time these patterns fire the bodies are
# already in the right branches.

[[pattern]]
id          = "oba_if_fullname_isempty_bare_to_any"
description = "%[If(X.FullName.IsEmpty)] → @[If(@[Y.Any()] == true)]"
provenance  = "hand-written"
verification = "verified"
org_context = "oba"
priority    = 100

match   = "%[If($entity.FullName.IsEmpty)]"
rewrite = "@[If(@[$entity_pine.Any()] == true)]"

[pattern.holes.entity]
kind = "path-segment"

[pattern.holes.entity_pine]
derive_from = "entity"
