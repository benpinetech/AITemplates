# ─── gender pronouns that humans inline as literal text ─────────────────────
# JDA uses %[X.HisHer] / %[X.HeShe] / %[X.HimHer] to substitute pronouns at
# render time; Pine handles this differently — humans just write the
# literal pronoun in the document and drop these tokens.

[[pattern]]
id          = "oba_drop_hishher"
description = "%[X.HisHer] — pronoun inlined in Pine, no equivalent"
provenance  = "hand-written"
verification = "verified"
org_context = "oba"
priority    = 200

match   = "%[$entity.HisHer]"
rewrite = []

[pattern.holes.entity]
kind = "path-segment"


