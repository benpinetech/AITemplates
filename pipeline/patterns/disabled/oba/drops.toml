# OBA drop patterns — JDA tokens that have NO Pine equivalent.
#
# These tokens appear in the JDA corpus but the human translator
# always omits them from the Pine version. We match them and emit
# zero Pine outputs (empty rewrite list) so:
#
#   - the LLM is never asked to translate them (no false-positive
#     translation that would look plausible but isn't in ground truth)
#   - the eval ignores the slot (an empty output contributes no
#     Pine tokens to the comparison)
#
# Inventory derived from corpus analysis: each entry below was
# verified by checking that NO Pine ground-truth file in the corpus
# contains a translated equivalent of these JDA tokens.
#
# See PLAN.md "Workstream 1" for the rationale; see prompts.py rules
# 4-6 in v1 for the original list.

# ─── identity / case fields with no Pine equivalent ─────────────────────────

[[pattern]]
id          = "oba_drop_stateidnum"
description = "%[X.StateIDNum] — no Pine equivalent (humans always drop)"
provenance  = "hand-written"
verification = "verified"
notes       = "Verified absent from Pine corpus across 294 templates."
org_context = "oba"
priority    = 200

match   = "%[$entity.StateIDNum]"
rewrite = []

[pattern.holes.entity]
kind = "path-segment"


[[pattern]]
id          = "oba_drop_dcnumber"
description = "%[DCNumber.DCNumber] — no Pine equivalent"
provenance  = "hand-written"
verification = "verified"
org_context = "oba"
priority    = 200

match   = "%[DCNumber.DCNumber]"
rewrite = []


