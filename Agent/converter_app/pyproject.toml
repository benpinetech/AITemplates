[project]
name = "jda-pine-converter"
version = "0.1.0"
description = "Desktop converter for JDA template → Pine template (uses Agent/v2)"
requires-python = ">=3.10"

# Dependencies — keep this list tight. The v2 library brings its own
# transitive deps (langchain, etc.) when imported, but the GUI layer
# only adds Qt and the keyring lib.
dependencies = [
    "PySide6>=6.6",
    "keyring>=24",   # OS-native secure storage for the Anthropic API key
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",   # for `pyinstaller jda_pine_converter.spec`
]

[project.scripts]
jda-pine-converter = "converter_app.app:main"

[tool.setuptools.packages.find]
include = ["converter_app*"]
