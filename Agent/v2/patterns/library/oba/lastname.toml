# OBA last-name patterns — TitleCase wrapping for salutation use.
#
# Source: pine_syntax_ground_truth.txt §30 ("TitleCase(X.LastName) →
# X.first.FormatName(L).SetCasing(Title) when used as salutation
# target — OBA letters") and §33 (FormatName(L).SetCasing(Title) form).

[[pattern]]
id          = "oba_lastname_titlecase"
description = "TitleCase(X.LastName) → X.first.FormatName(L).SetCasing(Title)  (salutation target)"
provenance  = "hand-written"
verification = "verified"
notes       = "§30, §33 — common OBA salutation form ('Dear @[X.first.FormatName(L).SetCasing(Title)]:')."
org_context = "oba"
priority    = 100

match   = "%[TitleCase($entity.LastName)]"
rewrite = "@[$entity_pine.first.FormatName(L).SetCasing(Title)]"

[pattern.holes.entity]
kind = "path-segment"

[pattern.holes.entity_pine]
derive_from = "entity"
transform   = "translate_jda_entity_to_pine"
