# Envelope (passthrough) patterns for control keywords.
#
# These fire when no chunk pattern claimed the control token. They
# rewrite the bracket envelope (%[ → @[) and preserve the condition
# verbatim. The condition may not be semantically valid Pine yet
# (e.g. %[If(X.IsEmpty=true)] becomes @[If(X.IsEmpty=true)] — Pine's
# real form would be @[If(@[X.Any()] == true)]) but it's at least
# parseable Pine, the diff is clear, and the mapper can add a more
# specific pattern when one is needed.
#
# Priority is intentionally low (50) so chunk patterns and richer
# single-token patterns always win when they apply.

# ── bare structural keywords ────────────────────────────────────────────────

[[pattern]]
id          = "envelope_else"
description = "%[Else] → @[Else]"
provenance  = "hand-written"
verification = "verified"
notes       = "Envelope fallback for the Else keyword."
org_context = "any"
priority    = 50

match   = "%[Else]"
rewrite = "@[Else]"


[[pattern]]
id          = "envelope_endif"
description = "%[EndIf] → @[EndIf]"
provenance  = "hand-written"
verification = "verified"
notes       = "Envelope fallback for the EndIf keyword."
org_context = "any"
priority    = 50

match   = "%[EndIf]"
rewrite = "@[EndIf]"


[[pattern]]
id          = "envelope_endforeach"
description = "%[EndForeach] → @[EndForEach]"
provenance  = "hand-written"
verification = "verified"
notes       = "Envelope fallback for the EndForeach keyword."
org_context = "any"
priority    = 50

match   = "%[EndForeach]"
rewrite = "@[EndForEach]"


# ── conditional openers (capture the condition verbatim) ───────────────────

[[pattern]]
id          = "envelope_if"
description = "%[If($cond)] → @[If($cond)] (condition preserved verbatim)"
provenance  = "hand-written"
verification = "verified"
notes       = "Envelope fallback for If — condition isn't semantically translated."
org_context = "any"
priority    = 50

match   = "%[If($cond)]"
rewrite = "@[If($cond)]"

[pattern.holes.cond]
kind        = "expression"
description = "the If condition; captured as a JDA AST and re-rendered as Pine"


[[pattern]]
id          = "envelope_elseif"
description = "%[ElseIf($cond)] → @[ElseIf($cond)] (condition preserved verbatim)"
provenance  = "hand-written"
verification = "verified"
notes       = "Envelope fallback for ElseIf — condition isn't semantically translated."
org_context = "any"
priority    = 50

match   = "%[ElseIf($cond)]"
rewrite = "@[ElseIf($cond)]"

[pattern.holes.cond]
kind        = "expression"
description = "the ElseIf condition; captured as a JDA AST and re-rendered as Pine"
