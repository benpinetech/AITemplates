# JDA Subdocument(name-path) → one-or-more @[SubDocument(numeric-id)] tokens.
#
# Source: pine_syntax_ground_truth.txt §36. The number of output tokens
# varies by path (OBA's Template\* family produces TWO IDs in order; PD's
# Subdocs\* family produces one). We use a `rewrite_function` rather
# than a fixed template because the output count is dynamic.

[[pattern]]
id          = "subdocument_path_expansion"
description = "Subdocument(<path>) → one or more SubDocument(<id>) tokens (org-aware)"
provenance  = "hand-written"
verification = "verified"
notes       = "§36. Function rewrite: see expand_subdocument_path in transforms.py."
org_context = "any"
priority    = 100

match            = "%[Subdocument($path)]"
rewrite_function = "expand_subdocument_path"

[pattern.holes.path]
kind        = "subdoc-path"
description = "JDA subdocument path argument like 'Template\\Letterhead'"
