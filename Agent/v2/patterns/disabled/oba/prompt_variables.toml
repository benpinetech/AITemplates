# ─── document-event fields → letter prompt variable ─────────────────────────
# Per v1 prompt rule 9: "DocumentEvents.EventDt in letter headers →
# prompt variable. HOWEVER FormatDate(CurrentDate(), …) is NOT an
# event date." This pattern only matches the bare access; the wrapped
# form FormatDate(CurrentDate(), …) is already handled by the
# currentdate_format_to_preset pattern.

[[pattern]]
id          = "oba_documentevents_eventdt"
description = "%[JW_DocumentEvents.EventDt] → @[DateOfLetter]"
provenance  = "hand-written"
verification = "verified"
notes       = "Letter-header event date — Pine treats it as a prompt variable."
org_context = "oba"
priority    = 100

match   = "%[JW_DocumentEvents.EventDt]"
rewrite = "@[DateOfLetter]"


