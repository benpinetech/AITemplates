# OBA prompt-variable patterns.
#
# JDA represents prompt variables as ``%[Name.Name]`` (both segments
# equal). Pine collapses them to ``@[Name]``. The verified Pine
# corpus only contains a Pine equivalent for some of these names —
# others get dropped or rewritten by the human translator. We only
# pattern-translate the names that actually have Pine equivalents.

[[pattern]]
id          = "oba_prompt_var_prcmeeting"
description = "%[PRCMeeting.DateofPRC] → @[PRCMeeting]"
provenance  = "hand-written"
verification = "verified"
notes       = "Confirmed by 7 corpus occurrences; Pine has @[PRCMeeting] verbatim."
org_context = "oba"
priority    = 100

match   = "%[PRCMeeting.DateofPRC]"
rewrite = "@[PRCMeeting]"


