# OBA address-field patterns — bare and TitleCase-wrapped variants.
#
# OBA's actual convention (per the verified-pine corpus, ~600
# occurrences each of .first.{StreetAddress,City,State,Zip}) is plain
# .first.<FieldName> with NO SetCasing modifier. The TitleCase
# wrapper that JDA sources sometimes have around the City field gets
# DROPPED — the wrapper's intent (presentation-time title-casing) is
# absorbed by Pine's data layer.
#
# Field-name renames (per §30):
#   .Address   → .StreetAddress
#   .StateCode → .State
#   .City      → .City  (same)
#   .Zip       → .Zip   (same)
#
# These per-field patterns sit at the same priority as the existing
# 4-token chunk pattern ``oba_address_block_titlecase``. The chunk
# wins when its 4-element shape matches; otherwise the per-field
# patterns catch the bare and wrapped variants individually.

# ── bare forms ──────────────────────────────────────────────────────────────

[[pattern]]
id          = "oba_address_bare"
description = "%[X.Address] (bare) → @[Y.first.StreetAddress]"
provenance  = "hand-written"
verification = "verified"
notes       = "§30 — JDA .Address renames to Pine .StreetAddress."
org_context = "oba"
priority    = 100

match   = "%[$entity.Address]"
rewrite = "@[$entity_pine.first.StreetAddress]"

[pattern.holes.entity]
kind = "path-segment"

[pattern.holes.entity_pine]
derive_from = "entity"
transform   = "translate_jda_entity_to_pine"


