# ── TitleCase-wrapped forms (drop the wrapper per §17) ─────────────────────

[[pattern]]
id          = "oba_address_titlecase_drop"
description = "%[TitleCase(X.Address)] → @[Y.first.StreetAddress] (drops SetCasing per OBA convention)"
provenance  = "hand-written"
verification = "verified"
notes       = "§17 — TitleCase wrappers on OBA address fields are dropped."
org_context = "oba"
priority    = 110

match   = "%[TitleCase($entity.Address)]"
rewrite = "@[$entity_pine.first.StreetAddress]"

[pattern.holes.entity]
kind = "path-segment"

[pattern.holes.entity_pine]
derive_from = "entity"
transform   = "translate_jda_entity_to_pine"


